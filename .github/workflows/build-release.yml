name: Build & Auto-Release APK

# 每次 push（以及手动触发）都会触发构建并发布 Release
on:
  push:
    branches: [master, main]
  workflow_dispatch:

# 需要写权限以创建 Release 并上传附件
permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---- 自动化测试（测试失败则中断，不进入构建/发布）----
      - name: Run JVM unit tests
        run: ./gradlew testDebugUnitTest --console=plain -PCI_BUILD_ID=${{ github.run_id }} -PCI_VERSION_CODE=${{ github.run_number }}

      # 校验 FetchActivity 内嵌的 JS 注入脚本（语法 + 行为）。
      # ubuntu-latest 自带 python3 与 node。
      - name: Run JS hook tests
        run: bash js-tests/run_js_tests.sh

      # 注入 CI_BUILD_ID（= run_id，更新检测用）与 CI_VERSION_CODE（= run_number，versionCode 用）。
      # run_number 严格递增且为小整数，保证每次 Release 的 versionCode 必然增大，
      # 否则新版 APK（固定密钥签名）因版本号不递增仍无法覆盖安装。
      - name: Build Debug APK
        run: ./gradlew assembleDebug --console=plain -PCI_BUILD_ID=${{ github.run_id }} -PCI_VERSION_CODE=${{ github.run_number }}

      - name: Build Release APK
        run: ./gradlew assembleRelease --console=plain -PCI_BUILD_ID=${{ github.run_id }} -PCI_VERSION_CODE=${{ github.run_number }}

      # 签名：优先使用 Secrets 中固定的 release keystore（支持覆盖安装升级）；
      # 未配置 Secrets 时回退为临时 keystore（每次构建签名不同，需卸载重装）。
      - name: Sign release APK
        shell: bash
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.RELEASE_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.RELEASE_KEY_PASS }}
        run: |
          # 使用最新的 build-tools
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          echo "Using build-tools: $BT"

          if [ -n "$KS_B64" ]; then
            echo "Using fixed release keystore from Secrets"
            # 清理可能混入的 CR/LF（Windows 管道设置 Secret 时常见），再解码
            printf '%s' "$KS_B64" | tr -d '\r\n' | base64 -d > "$RUNNER_TEMP/release.jks"
            KS_PASS=${KS_PASS:-douyinfavshare}
            KS_ALIAS=${KS_ALIAS:-douyin}
            KS_KEY_PASS=${KS_KEY_PASS:-$KS_PASS}
          else
            echo "No RELEASE_KEYSTORE_B64 secret, generating a temporary keystore"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/release.jks" \
              -storepass douyinfavshare -alias douyin -keypass douyinfavshare \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Douyin Fav Share, O=Personal, C=CN"
            KS_PASS=douyinfavshare
            KS_ALIAS=douyin
            KS_KEY_PASS=douyinfavshare
          fi

          # zipalign + apksigner 签名
          "$BT/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass "pass:${KS_PASS}" \
            --ks-key-alias "${KS_ALIAS}" \
            --key-pass "pass:${KS_KEY_PASS}" \
            --out app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/aligned.apk"

      - name: Generate checksums
        run: |
          cd app/build/outputs/apk
          sha256sum debug/app-debug.apk release/app-release.apk > "$RUNNER_TEMP/SHA256SUMS.txt"
          cat "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_id }}
          name: Build #${{ github.run_id }} (${{ github.ref_name }})
          body: |
            ## 自动构建 Release

            - **Commit**: `${{ github.sha }}`
            - **分支**: `${{ github.ref_name }}`
            - **触发者**: @${{ github.actor }}

            ### APK 附件
            - `app-debug.apk` — Debug 构建（自动签名，可直接安装）
            - `app-release.apk` — Release 构建（CI 生成的密钥签名，可直接安装）
            - `SHA256SUMS.txt` — 校验和

            > 每次 push 自动生成，Release 名称按构建序号递增。
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/SHA256SUMS.txt
          fail_on_unmatched_files: true
